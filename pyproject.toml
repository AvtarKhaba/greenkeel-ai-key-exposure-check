[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-key-exposure-check"
description = "Count candidate AI provider credentials on your own machine. Local only: no network, no files written, secrets never printed."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "GreenKeel" }]
dependencies = []
dynamic = ["version"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://greenkeel.dev"
Source = "https://github.com/AvtarKhaba/greenkeel-ai-key-exposure-check"

[project.scripts]
ai-key-exposure-check = "ai_key_exposure_check.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ai_key_exposure_check.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
